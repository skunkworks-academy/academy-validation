name: Publish Pages with Academy search favicons
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: academy-pages-favicons
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Restore runner ownership after Jekyll container build
        # jekyll-build-pages can leave its generated output owned by root.
        # Only the checked-out build artifact is changed; no repo files or secrets.
        run: |
          set -euo pipefail
          test -d _site
          sudo chown -R "$(id -u):$(id -g)" _site
          test -w _site/images
      - name: Install and verify Academy search favicons
        uses: skunkworks-academy/www/.github/actions/search-favicons@070f621875577a66ae43cdffa7e9d20c65efdc71
        with:
          artifact-path: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
