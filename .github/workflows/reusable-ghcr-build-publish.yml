name: Reusable GHCR Build and Publish

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context
        required: false
        default: .
        type: string
      dockerfile:
        description: Dockerfile path
        required: false
        default: ./Dockerfile
        type: string
      component:
        description: Optional component prefix for multi-image repositories
        required: false
        default: ''
        type: string
      platforms:
        description: Build platforms
        required: false
        default: linux/amd64
        type: string
      publish_latest:
        description: Publish a moving latest/component-latest tag
        required: false
        default: true
        type: boolean
    secrets:
      ORG_PACKAGE_REGISTRY_PAT:
        required: false
    outputs:
      image:
        description: Canonical GHCR image name
        value: ${{ jobs.build-publish.outputs.image }}
      digest:
        description: Published image digest
        value: ${{ jobs.build-publish.outputs.digest }}
      immutable_tag:
        description: Immutable tag published for this commit
        value: ${{ jobs.build-publish.outputs.immutable_tag }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      immutable_tag: ${{ steps.meta.outputs.immutable_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve canonical image identity
        id: meta
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          component="$(printf '%s' "$COMPONENT" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')"
          component="${component#-}"
          component="${component%-}"

          if [ -n "$component" ]; then
            immutable_tag="${component}-${GITHUB_SHA}"
            moving_tag="${component}-latest"
          else
            immutable_tag="${GITHUB_SHA}"
            moving_tag="latest"
          fi

          tags="${image}:${immutable_tag}"
          if [ "$PUBLISH_LATEST" = "true" ]; then
            tags="${tags}"$'\n'"${image}:${moving_tag}"
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=$immutable_tag" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            printf '%s\n' "$tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Authoritative Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_PACKAGE_REGISTRY_PAT != '' && secrets.ORG_PACKAGE_REGISTRY_PAT || github.token }}

      - name: Build once and push to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.run_id }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Emit release coordinates
        shell: bash
        run: |
          {
            echo '## Published artifact'
            echo ''
            echo '- Image: `${{ steps.meta.outputs.image }}`'
            echo '- Immutable tag: `${{ steps.meta.outputs.immutable_tag }}`'
            echo '- Digest: `${{ steps.build.outputs.digest }}`'
            echo '- Commit: `${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"
