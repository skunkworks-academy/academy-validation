name: Organization Artifact Registry Audit

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG_NAME: skunkworks-academy

jobs:
  audit-organization:
    name: Audit all organization repositories
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.ORG_PACKAGE_REGISTRY_PAT }}
    steps:
      - name: Checkout validation control plane
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify organization audit credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ORG_PACKAGE_REGISTRY_PAT is required for complete public/private organization coverage." >&2
            echo "Grant read access to organization metadata and repository contents for every repository in scope." >&2
            exit 2
          fi
          # An expiring/invalid PAT must fail closed: do not fall back to the
          # repository-scoped GITHUB_TOKEN, which cannot audit private org repos.
          if ! gh api /user --jq '.login' > /dev/null; then
            echo "::error title=Invalid organization audit credential::ORG_PACKAGE_REGISTRY_PAT is expired, revoked or invalid (GitHub returned 401). Rotate the secret using a scoped, approved GitHub token with read access to all organisation repositories and packages." >&2
            echo "### Organisation registry audit blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "The configured \`ORG_PACKAGE_REGISTRY_PAT\` is rejected by GitHub. Audit was not executed and coverage is **unknown**. An organisation administrator must rotate the token, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          if ! gh api "/orgs/${ORG_NAME}" --jq '.login' > /dev/null; then
            echo "::error title=Insufficient organisation access::Audit token cannot read the target organisation. Check organisation approval and token scope." >&2
            exit 2
          fi
          if ! gh api --paginate "/orgs/${ORG_NAME}/repos?type=all&per_page=100" --jq '.[].full_name' | grep -Fxq "${ORG_NAME}/academy-validation"; then
            echo "::error title=Incomplete organisation repository coverage::Token cannot enumerate required organisation repositories. Review installation/SSO authorisation and permissions." >&2
            exit 2
          fi
          echo "Authenticated token and organisation access verified. Full registry audit will now run." >> "$GITHUB_STEP_SUMMARY"

      - name: Audit organization artifact targets
        run: node scripts/audit-organization-registries.mjs --org "$ORG_NAME"

      - name: Generate registry migration matrix
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/organization-registry-audit/organization-registry-audit.json ]; then
            node scripts/generate-registry-migration-matrix.mjs
          else
            echo "Organization audit JSON was not generated; migration matrix cannot be produced." >&2
          fi

      - name: Publish organization audit summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/organization-registry-audit/organization-registry-audit.md ]; then
            cat artifacts/organization-registry-audit/organization-registry-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/organization-registry-audit/organization-registry-migration-matrix.md ]; then
            printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/organization-registry-audit/organization-registry-migration-matrix.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload organization audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-registry-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/organization-registry-audit/
          if-no-files-found: warn
          retention-days: 90
